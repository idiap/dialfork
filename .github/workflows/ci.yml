name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: pre-commit (licenses, whitespace, large files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Python 3.9 is not built for newer Ubuntu images
          - {python: "3.9", os: ubuntu-24.04}
          - {python: "3.12", os: ubuntu-latest}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Download DialFork and STAR
        run: |
          pip install huggingface_hub pyarrow
          python scripts/download_data.py
      - name: evaluate.py on the shipped prediction files
        run: python tests/test_release.py
      - name: Annotation tool
        run: |
          python -m annotool.tests
          python -m annotool.test_server
          python -m annotool.check_js
